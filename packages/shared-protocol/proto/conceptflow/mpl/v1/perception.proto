syntax = "proto3";

package conceptflow.mpl.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "org.conceptflow.mpl.v1";
option java_outer_classname = "PerceptionProto";
option csharp_namespace = "ConceptFlow.Mpl.V1";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message EphemeralIdentity {
  string session_id = 1;
  bytes nonce = 2;
  google.protobuf.Timestamp expires_at = 3;
}

enum ImageEncoding {
  IMAGE_ENCODING_UNSPECIFIED = 0;
  IMAGE_ENCODING_RGB8 = 1;
  IMAGE_ENCODING_RGBA8 = 2;
  IMAGE_ENCODING_GRAY8 = 3;
  IMAGE_ENCODING_JPEG = 4;
  IMAGE_ENCODING_PNG = 5;
}

enum CueModality {
  CUE_MODALITY_UNSPECIFIED = 0;
  CUE_MODALITY_EARCON = 1;
  CUE_MODALITY_SPEECH = 2;
  CUE_MODALITY_HAPTIC = 3;
}

message CapabilitySet {
  repeated ImageEncoding image_encodings = 1;
  repeated CueModality cue_modalities = 2;
  uint32 max_width = 3;
  uint32 max_height = 4;
  uint64 max_frame_bytes = 5;
  bool supports_cancellation = 6;
  bool supports_supersession = 7;
  bool supports_pose = 8;
  bool supports_intrinsics = 9;
}

message QualityOfService {
  uint32 max_in_flight = 1;
  uint32 target_frames_per_second = 2;
  google.protobuf.Duration result_deadline = 3;
  bool allow_frame_drop = 4;
  uint32 max_cues_per_result = 5;
}

message NegotiateRequest {
  string client_instance_id = 1;
  repeated ProtocolVersion supported_versions = 2;
  EphemeralIdentity identity = 3;
  CapabilitySet capabilities = 4;
  QualityOfService requested_qos = 5;
}

message NegotiateResponse {
  ProtocolVersion selected_version = 1;
  EphemeralIdentity identity = 2;
  CapabilitySet capabilities = 3;
  QualityOfService accepted_qos = 4;
  ErrorStatus error = 5;
}

message ImageDescriptor {
  uint32 width = 1;
  uint32 height = 2;
  uint32 row_stride_bytes = 3;
  ImageEncoding encoding = 4;
  string media_type = 5;
  uint64 payload_bytes = 6;
  bytes sha256 = 7;
}

enum CoordinateFrame {
  COORDINATE_FRAME_UNSPECIFIED = 0;
  COORDINATE_FRAME_CAMERA_OPTICAL = 1;
  COORDINATE_FRAME_HEAD = 2;
  COORDINATE_FRAME_BODY = 3;
  COORDINATE_FRAME_LOCAL_WORLD = 4;
}

message CameraIntrinsics {
  double focal_x_pixels = 1;
  double focal_y_pixels = 2;
  double principal_x_pixels = 3;
  double principal_y_pixels = 4;
  repeated double distortion_coefficients = 5;
  uint32 calibrated_width = 6;
  uint32 calibrated_height = 7;
  CameraIntrinsicsProvenance provenance = 8;
  CameraIntrinsicsUncertainty uncertainty = 9;
  CameraHeadExtrinsic head_from_camera_extrinsic = 10;
}

enum CameraIntrinsicsProvenance {
  CAMERA_INTRINSICS_PROVENANCE_UNSPECIFIED = 0;
  CAMERA_INTRINSICS_PROVENANCE_UNKNOWN = 1;
  CAMERA_INTRINSICS_PROVENANCE_CALIBRATED = 2;
  CAMERA_INTRINSICS_PROVENANCE_DERIVED = 3;
}

// Standard-deviation estimates are optional. Absence means the producer does
// not have defensible uncertainty values and must not imply exact calibration.
message CameraIntrinsicsUncertainty {
  double focal_x_stddev_pixels = 1;
  double focal_y_stddev_pixels = 2;
  double principal_x_stddev_pixels = 3;
  double principal_y_stddev_pixels = 4;
}

// Rotation maps camera-optical vectors into the rigid glasses/head sensor
// frame used by Pose. Translation is optional because Camera2 PRIMARY_CAMERA
// pose data does not establish the camera-to-gyroscope/head origin.
message CameraHeadExtrinsic {
  Quaternion head_from_camera_rotation = 1;
  Vector3 head_from_camera_translation_meters = 2;
  bool translation_available = 3;
  CameraExtrinsicProvenance provenance = 4;
  bytes verification_sha256 = 5;
  optional double rotation_uncertainty_degrees = 6;
  optional double translation_uncertainty_meters = 7;
}

enum CameraExtrinsicProvenance {
  CAMERA_EXTRINSIC_PROVENANCE_UNSPECIFIED = 0;
  CAMERA_EXTRINSIC_PROVENANCE_UNKNOWN = 1;
  CAMERA_EXTRINSIC_PROVENANCE_CAMERA2_SENSOR_COORDINATES = 2;
  CAMERA_EXTRINSIC_PROVENANCE_GUIDED_HAND_EYE = 3;
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Pose {
  CoordinateFrame reference_frame = 1;
  Vector3 translation_meters = 2;
  Quaternion rotation = 3;
  uint64 monotonic_timestamp_ns = 4;
}

message FramePayload {
  string request_id = 1;
  string session_id = 2;
  string stream_id = 3;
  uint64 frame_id = 4;
  uint64 capture_monotonic_timestamp_ns = 5;
  google.protobuf.Timestamp capture_wall_time = 6;
  ImageDescriptor image = 7;
  CameraIntrinsics intrinsics = 8;
  Pose pose = 9;
  bytes frame_data = 10;
  google.protobuf.Duration processing_deadline = 11;
  bool synthetic = 12;
}

// Stream leases are transport-neutral control messages. The transport is
// responsible for authenticating the peer; a client-provided identifier is
// never proof of authentication by itself.
enum SensorStreamKind {
  SENSOR_STREAM_KIND_UNSPECIFIED = 0;
  SENSOR_STREAM_KIND_CAMERA = 1;
  SENSOR_STREAM_KIND_IMU = 2;
  SENSOR_STREAM_KIND_MICROPHONE = 3;
  SENSOR_STREAM_KIND_TOUCH = 4;
}

enum StreamLeaseOperation {
  STREAM_LEASE_OPERATION_UNSPECIFIED = 0;
  STREAM_LEASE_OPERATION_OPEN = 1;
  STREAM_LEASE_OPERATION_RENEW = 2;
  STREAM_LEASE_OPERATION_CLOSE = 3;
}

message StreamLeaseRequest {
  string request_id = 1;
  string session_id = 2;
  string lease_id = 3;
  StreamLeaseOperation operation = 4;
  repeated SensorStreamKind requested_streams = 5;
  uint32 requested_duration_ms = 6;
  bool user_requested_microphone = 7;
  uint32 camera_relaxed_fps = 8;
  uint32 camera_motion_fps = 9;
  uint32 imu_max_batch_delay_ms = 10;
  uint32 imu_max_silence_ms = 11;
  // Zero for phone-originated requests; otherwise binds a glasses gesture
  // START to the resulting microphone sublease without exposing identity.
  uint64 originating_microphone_intent_id = 12;
}

message StreamLeaseGrant {
  string request_id = 1;
  string session_id = 2;
  string lease_id = 3;
  repeated SensorStreamKind granted_streams = 4;
  uint32 granted_duration_ms = 5;
  uint32 camera_relaxed_fps = 6;
  uint32 camera_motion_fps = 7;
  uint32 imu_max_batch_delay_ms = 8;
  uint32 imu_max_silence_ms = 9;
  ErrorStatus error = 10;
  uint64 originating_microphone_intent_id = 11;
}

message ImuReading {
  uint64 sequence_id = 1;
  Pose pose = 2;
  Vector3 angular_velocity_radians_per_second = 3;
  Vector3 linear_acceleration_meters_per_second_squared = 4;
  int32 orientation_accuracy = 5;
  uint64 angular_velocity_monotonic_timestamp_ns = 6;
  uint64 linear_acceleration_monotonic_timestamp_ns = 7;
}

message ImuBatch {
  string lease_id = 1;
  uint64 batch_id = 2;
  uint64 created_monotonic_timestamp_ns = 3;
  repeated ImuReading samples = 4;
}

// Camera frames are split for a bounded reliable ordered data channel. Only
// chunk zero carries frame_metadata, whose frame_data field must be empty.
message CameraFrameChunk {
  FramePayload frame_metadata = 1;
  uint64 frame_id = 2;
  uint32 chunk_index = 3;
  uint32 chunk_count = 4;
  uint64 total_payload_bytes = 5;
  bytes chunk_data = 6;
  uint64 capture_monotonic_timestamp_ns = 7;
}

enum AudioSampleEncoding {
  AUDIO_SAMPLE_ENCODING_UNSPECIFIED = 0;
  AUDIO_SAMPLE_ENCODING_PCM_S16LE = 1;
}

message MicrophoneChunk {
  string lease_id = 1;
  uint64 chunk_id = 2;
  uint64 capture_monotonic_timestamp_ns = 3;
  uint32 sample_rate_hz = 4;
  uint32 channel_count = 5;
  AudioSampleEncoding encoding = 6;
  bytes audio_data = 7;
}

// Raw, allowlisted events from the validated Rokid touch hardware. Gesture
// recognition remains a separate layer; retaining DOWN/UP preserves future
// gameplay semantics without making Unity depend on Android key codes.
enum RokidTouchKey {
  ROKID_TOUCH_KEY_UNSPECIFIED = 0;
  ROKID_TOUCH_KEY_PREAMBLE = 1;
  ROKID_TOUCH_KEY_SWIPE_FORWARD = 2;
  ROKID_TOUCH_KEY_SWIPE_BACKWARD = 3;
  ROKID_TOUCH_KEY_SINGLE_TAP = 4;
  ROKID_TOUCH_KEY_DOUBLE_TAP = 5;
  // Semantically recognized by YodaOS from raw KEY_PROG2. The raw key is not
  // delivered to an ordinary AccessibilityService on the validated RV203.
  ROKID_TOUCH_KEY_TWO_FINGER_LONG_PRESS = 6;
}

enum RokidTouchAction {
  ROKID_TOUCH_ACTION_UNSPECIFIED = 0;
  ROKID_TOUCH_ACTION_DOWN = 1;
  ROKID_TOUCH_ACTION_UP = 2;
  // A complete semantic gesture delivered as one system broadcast.
  ROKID_TOUCH_ACTION_TRIGGERED = 3;
}

message RokidTouchEvent {
  uint64 event_id = 1;
  uint64 observed_monotonic_timestamp_ns = 2;
  // Android KeyEvent time is uptime-based. For a semantic system broadcast,
  // this is the glasses-side broadcast-receipt uptime. It is retained for
  // deterministic replay; real-time fusion uses observed_monotonic_timestamp_ns.
  uint64 source_uptime_ms = 3;
  RokidTouchKey key = 4;
  RokidTouchAction action = 5;
  uint32 repeat_count = 6;
  bool canceled = 7;
  bool long_press = 8;
  int32 scan_code = 9;
}

// A live glasses link uses two separately authenticated, ordered TLS lanes.
// Sequence numbers are scoped to a lane and start at one for every new
// connection/session binding. The legacy SensorStreamEnvelope.sequence_id is
// retained for backwards compatibility and is not used to order across lanes.
enum LiveTransportLane {
  LIVE_TRANSPORT_LANE_UNSPECIFIED = 0;
  LIVE_TRANSPORT_LANE_REALTIME_CONTROL = 1;
  LIVE_TRANSPORT_LANE_CAMERA = 2;
}

enum LiveTransportPeerRole {
  LIVE_TRANSPORT_PEER_ROLE_UNSPECIFIED = 0;
  LIVE_TRANSPORT_PEER_ROLE_GLASSES = 1;
  LIVE_TRANSPORT_PEER_ROLE_HOST = 2;
}

message LiveLinkHello {
  ProtocolVersion protocol_version = 1;
  LiveTransportPeerRole peer_role = 2;
  // A fresh 32-byte value for every connection. It is not a credential.
  bytes connection_nonce = 3;
}

// Explicitly negotiated bounds for the direct Rokid Node <-> Android Node
// transport. These are transport capabilities, not promises that a modality
// is active; the separately authenticated lease remains authoritative.
message LiveLinkCapabilities {
  ProtocolVersion protocol_version = 1;
  LiveTransportPeerRole peer_role = 2;
  repeated SensorStreamKind supported_streams = 3;
  repeated ImageEncoding camera_encodings = 4;
  uint32 max_camera_width = 5;
  uint32 max_camera_height = 6;
  uint64 max_camera_frame_bytes = 7;
  uint32 max_audio_block_bytes = 8;
  uint32 max_imu_samples_per_batch = 9;
  uint32 max_touch_events_buffered = 10;
  bool supports_clock_sync = 11;
  bool supports_camera_latest_frame = 12;
  bool supports_diagnostic_spool = 13;
}

// Privacy-safe aggregate pressure telemetry. It deliberately contains no
// image/audio content, labels, addresses, identifiers, or raw sensor values.
message LiveLinkTelemetry {
  uint64 sampled_monotonic_timestamp_ns = 1;
  uint32 pending_camera_frames = 2;
  uint32 pending_imu_batches = 3;
  uint32 pending_audio_blocks = 4;
  uint32 pending_touch_events = 5;
  uint64 dropped_camera_frames = 6;
  uint64 dropped_imu_batches = 7;
  uint64 dropped_audio_blocks = 8;
  uint64 touch_overflow_events = 9;
  uint64 sent_realtime_messages = 10;
  uint64 sent_camera_messages = 11;
}

message LiveLaneOpenRequest {
  LiveTransportLane lane = 1;
  string session_id = 2;
  string lease_id = 3;
  bytes connection_nonce = 4;
  // Opaque, single-use, short-lived authentication issued over the already
  // authenticated realtime/control lane. Only the camera lane uses a ticket.
  bytes lane_ticket = 5;
}

message LiveLaneOpenResponse {
  LiveTransportLane lane = 1;
  bool accepted = 2;
  ErrorStatus error = 3;
}

message LiveLaneTicketGrant {
  LiveTransportLane lane = 1;
  bytes lane_ticket = 2;
  uint32 valid_for_ms = 3;
}

// The initiator records t0 before sending this request.
message ClockSyncRequest {
  uint64 probe_id = 1;
  uint64 initiator_send_monotonic_ns = 2;
}

// The responder records t1 on receipt and t2 immediately before sending. The
// initiator records t3 on receipt and computes the NTP-style offset/RTT.
message ClockSyncResponse {
  uint64 probe_id = 1;
  uint64 initiator_send_monotonic_ns = 2;
  uint64 responder_receive_monotonic_ns = 3;
  uint64 responder_send_monotonic_ns = 4;
}

message LiveLinkKeepalive {
  uint64 nonce = 1;
  uint64 sent_monotonic_ns = 2;
  bool response = 3;
}

// An explicit wearer action observed on the glasses. This intent is not a
// lease: the authenticated host remains responsible for granting a bounded
// microphone sublease before samples can be transmitted.
enum MicrophoneControlOperation {
  MICROPHONE_CONTROL_OPERATION_UNSPECIFIED = 0;
  MICROPHONE_CONTROL_OPERATION_START = 1;
  MICROPHONE_CONTROL_OPERATION_STOP = 2;
}

message MicrophoneControlIntent {
  string session_id = 1;
  string lease_id = 2;
  uint64 intent_id = 3;
  uint64 created_monotonic_timestamp_ns = 4;
  MicrophoneControlOperation operation = 5;
  bool user_requested = 6;
  // Required and bounded for START; exactly zero for STOP.
  uint32 requested_duration_ms = 7;
}

message MicrophoneControlResult {
  string session_id = 1;
  string lease_id = 2;
  uint64 intent_id = 3;
  MicrophoneControlOperation operation = 4;
  bool accepted = 5;
  ErrorStatus error = 6;
}

// A physical input sequence observed by Rokid Node. Recognition alone never
// grants sensor access; Android Node returns a separately typed command.
enum RokidGestureOperation {
  ROKID_GESTURE_OPERATION_UNSPECIFIED = 0;
  ROKID_GESTURE_OPERATION_ENABLE_NODE = 1;
  ROKID_GESTURE_OPERATION_DISABLE_NODE = 2;
}

message RokidGestureIntent {
  string session_id = 1;
  string lease_id = 2;
  uint64 gesture_id = 3;
  uint64 observed_monotonic_timestamp_ns = 4;
  RokidGestureOperation operation = 5;
  bool user_initiated = 6;
}

enum RokidNodeCommandOperation {
  ROKID_NODE_COMMAND_OPERATION_UNSPECIFIED = 0;
  ROKID_NODE_COMMAND_OPERATION_ACTIVATE_NODE = 1;
  ROKID_NODE_COMMAND_OPERATION_SLEEP_NODE = 2;
  ROKID_NODE_COMMAND_OPERATION_PLAY_BRAND_SEQUENCE = 3;
}

message RokidNodeCommand {
  string session_id = 1;
  string lease_id = 2;
  uint64 command_id = 3;
  // Zero for an explicit Android Node control; otherwise correlates a gesture.
  uint64 originating_gesture_id = 4;
  uint64 issued_monotonic_timestamp_ns = 5;
  uint32 valid_for_ms = 6;
  RokidNodeCommandOperation operation = 7;
  bool user_authorized = 8;
}

message RokidNodeCommandResult {
  string session_id = 1;
  string lease_id = 2;
  uint64 command_id = 3;
  uint64 originating_gesture_id = 4;
  RokidNodeCommandOperation operation = 5;
  bool accepted_for_execution = 6;
  ErrorStatus error = 7;
}

// Android Node polls this bounded manifest over the already-authenticated
// realtime/control lane. The JSON bytes are the exact public-safe projection
// of the same records persisted in Rokid Node's app-private spool.
enum SpoolRecordKind {
  SPOOL_RECORD_KIND_UNSPECIFIED = 0;
  SPOOL_RECORD_KIND_CAMERA = 1;
  SPOOL_RECORD_KIND_IMU = 2;
  SPOOL_RECORD_KIND_MICROPHONE = 3;
}

message SpoolRecord {
  string record_id = 1;
  uint64 revision = 2;
  uint64 created_monotonic_timestamp_ns = 3;
  SpoolRecordKind kind = 4;
  // Relative to the private spool root. Empty for inline IMU records.
  string relative_path = 5;
  uint64 artifact_bytes = 6;
  bytes artifact_sha256 = 7;
  oneof metadata {
    FramePayload camera_metadata = 8;
    ImuBatch imu_batch = 9;
    MicrophoneChunk microphone_metadata = 10;
  }
}

message SpoolManifestPoll {
  uint64 known_revision = 1;
  uint32 max_records = 2;
}

message SpoolManifestSnapshot {
  uint64 revision = 1;
  bytes manifest_json_utf8 = 2;
  bytes manifest_sha256 = 3;
  repeated SpoolRecord records = 4;
}

message SpoolArtifactRequest {
  string record_id = 1;
  uint64 offset = 2;
  uint32 max_bytes = 3;
}

message SpoolArtifactChunk {
  string record_id = 1;
  uint64 offset = 2;
  uint64 total_bytes = 3;
  bytes data = 4;
  bytes artifact_sha256 = 5;
  bool end_of_file = 6;
}

message SpoolRecordsAck {
  uint64 manifest_revision = 1;
  repeated string record_ids = 2;
}

message LiveLinkControl {
  oneof payload {
    LiveLinkHello hello = 1;
    LiveLaneOpenRequest lane_open_request = 2;
    LiveLaneOpenResponse lane_open_response = 3;
    ClockSyncRequest clock_sync_request = 4;
    ClockSyncResponse clock_sync_response = 5;
    LiveLinkKeepalive keepalive = 6;
    StreamLeaseRequest lease_request = 7;
    StreamLeaseGrant lease_grant = 8;
    ErrorStatus error = 9;
    LiveLaneTicketGrant lane_ticket_grant = 10;
    MicrophoneControlIntent microphone_control_intent = 11;
    MicrophoneControlResult microphone_control_result = 12;
    RokidGestureIntent rokid_gesture_intent = 13;
    RokidNodeCommand rokid_node_command = 14;
    RokidNodeCommandResult rokid_node_command_result = 15;
    SpoolManifestPoll spool_manifest_poll = 16;
    SpoolManifestSnapshot spool_manifest_snapshot = 17;
    SpoolArtifactRequest spool_artifact_request = 18;
    SpoolArtifactChunk spool_artifact_chunk = 19;
    SpoolRecordsAck spool_records_ack = 20;
    LiveLinkCapabilities capabilities = 21;
    LiveLinkTelemetry telemetry = 22;
  }
}

// Canonical record carried by the bounded TLS framing layer. session_id,
// lease_id, lane, and lane_sequence_id are authenticated by TLS plus the
// camera-lane ticket and must be checked before delivering the nested payload.
message LiveLinkEnvelope {
  string session_id = 1;
  string lease_id = 2;
  LiveTransportLane lane = 3;
  uint64 lane_sequence_id = 4;
  uint64 sent_monotonic_timestamp_ns = 5;
  oneof payload {
    LiveLinkControl control = 6;
    SensorStreamEnvelope sensor = 7;
  }
}

// This envelope can be carried by a reliable ordered WebRTC data channel or
// another bounded authenticated media transport. It does not define signaling
// or confer authentication.
message SensorStreamEnvelope {
  string session_id = 1;
  string lease_id = 2;
  uint64 sequence_id = 3;
  uint64 sent_monotonic_timestamp_ns = 4;
  oneof payload {
    CameraFrameChunk camera_chunk = 5;
    ImuBatch imu_batch = 6;
    MicrophoneChunk microphone_chunk = 7;
    StreamLeaseGrant lease_grant = 8;
    ErrorStatus error = 9;
    RokidTouchEvent touch_event = 10;
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  ERROR_CODE_OVERSIZE = 3;
  ERROR_CODE_OVERLOADED = 4;
  ERROR_CODE_CANCELLED = 5;
  ERROR_CODE_DEADLINE_EXCEEDED = 6;
  ERROR_CODE_WORKER_UNAVAILABLE = 7;
  ERROR_CODE_STALE = 8;
  ERROR_CODE_INTERNAL = 9;
}

message ErrorStatus {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  uint32 retry_after_ms = 4;
  string correlation_id = 5;
}

message Provenance {
  string component = 1;
  string component_version = 2;
  string worker_id = 3;
  string model_id = 4;
  string model_version = 5;
  string artifact_digest = 6;
  uint64 processing_started_monotonic_ns = 7;
  uint64 processing_finished_monotonic_ns = 8;
  repeated string source_result_ids = 9;
  bool synthetic = 10;
}

message BoundingBox {
  double left = 1;
  double top = 2;
  double right = 3;
  double bottom = 4;
}

message PerceptionObservation {
  string observation_id = 1;
  string category = 2;
  string description = 3;
  double confidence = 4;
  BoundingBox normalized_bounds = 5;
  CoordinateFrame coordinate_frame = 6;
  double azimuth_degrees = 7;
  double elevation_degrees = 8;
  double distance_meters = 9;
  Provenance provenance = 10;
}

enum CueCategory {
  CUE_CATEGORY_UNSPECIFIED = 0;
  CUE_CATEGORY_OBSTACLE = 1;
  CUE_CATEGORY_NAVIGATION = 2;
  CUE_CATEGORY_TEXT = 3;
  CUE_CATEGORY_PERSON = 4;
  CUE_CATEGORY_OBJECT = 5;
  CUE_CATEGORY_SCENE = 6;
  CUE_CATEGORY_SYSTEM = 7;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_AHEAD = 1;
  DIRECTION_LEFT = 2;
  DIRECTION_RIGHT = 3;
  DIRECTION_ABOVE = 4;
  DIRECTION_BELOW = 5;
  DIRECTION_BEHIND = 6;
}

enum Urgency {
  URGENCY_UNSPECIFIED = 0;
  URGENCY_LOW = 1;
  URGENCY_NORMAL = 2;
  URGENCY_HIGH = 3;
  URGENCY_CRITICAL = 4;
}

message Earcon {
  string earcon_id = 1;
  float gain = 2;
  float pitch = 3;
  bool spatialized = 4;
}

message Speech {
  string text = 1;
  string language_tag = 2;
  bool interrupt = 3;
}

enum HapticPattern {
  HAPTIC_PATTERN_UNSPECIFIED = 0;
  HAPTIC_PATTERN_PULSE = 1;
  HAPTIC_PATTERN_DOUBLE_PULSE = 2;
  HAPTIC_PATTERN_RAMP = 3;
}

message Haptic {
  HapticPattern pattern = 1;
  float intensity = 2;
  uint32 duration_ms = 3;
}

message CueCancellation {
  repeated string cue_ids = 1;
  string reason = 2;
}

message CueSupersession {
  repeated string cue_ids = 1;
  string reason = 2;
}

message PerceptionCue {
  string cue_id = 1;
  uint64 frame_id = 2;
  uint64 created_monotonic_timestamp_ns = 3;
  uint32 ttl_ms = 4;
  CueCategory category = 5;
  string description = 6;
  double confidence = 7;
  uint32 priority = 8;
  CoordinateFrame coordinate_frame = 9;
  double azimuth_degrees = 10;
  double elevation_degrees = 11;
  double distance_meters = 12;
  Direction direction = 13;
  Urgency urgency = 14;
  Earcon earcon = 15;
  Speech speech = 16;
  Haptic haptic = 17;
  CueCancellation cancel = 18;
  CueSupersession supersede = 19;
  Provenance provenance = 20;
}

message PerceptionResult {
  string result_id = 1;
  string request_id = 2;
  string session_id = 3;
  string stream_id = 4;
  uint64 frame_id = 5;
  uint64 capture_monotonic_timestamp_ns = 6;
  uint64 completed_monotonic_timestamp_ns = 7;
  repeated PerceptionObservation observations = 8;
  repeated PerceptionCue cues = 9;
  ErrorStatus error = 10;
  Provenance provenance = 11;
}

message HealthRequest {
  bool include_workers = 1;
}

enum ServingStatus {
  SERVING_STATUS_UNSPECIFIED = 0;
  SERVING_STATUS_SERVING = 1;
  SERVING_STATUS_DEGRADED = 2;
  SERVING_STATUS_NOT_SERVING = 3;
}

message WorkerHealth {
  string worker_id = 1;
  string device = 2;
  bool healthy = 3;
  uint32 consecutive_failures = 4;
  uint32 queue_depth = 5;
}

message HealthResponse {
  ServingStatus status = 1;
  ProtocolVersion protocol_version = 2;
  repeated WorkerHealth workers = 3;
  uint32 queue_depth = 4;
  uint32 queue_capacity = 5;
}

service PerceptionService {
  rpc Negotiate(NegotiateRequest) returns (NegotiateResponse);
  rpc ProcessFrame(FramePayload) returns (PerceptionResult);
  rpc Health(HealthRequest) returns (HealthResponse);
}
