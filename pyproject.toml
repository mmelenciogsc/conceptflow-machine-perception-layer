# SPDX-License-Identifier: MIT OR Apache-2.0
[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "packages/shared-protocol/src",
  "packages/host-runtime/src",
  "packages/perception-core/src",
  "services/cuda-cluster/src",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "packages/shared-protocol/src/conceptflow/mpl/v1/perception_pb2.py",
  "packages/shared-protocol/src/conceptflow/mpl/v1/perception_pb2.pyi",
  "packages/shared-protocol/src/conceptflow/mpl/v1/perception_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "conceptflow.mpl.v1.perception_pb2",
  "conceptflow.mpl.v1.perception_pb2_grpc",
]
ignore_errors = true
