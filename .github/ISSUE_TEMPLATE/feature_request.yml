# SPDX-License-Identifier: MIT OR Apache-2.0
name: Feature request
description: Propose a bounded, user-centered improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or operational constraint should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior and acceptance criteria, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Accessibility, privacy, and safety considerations
      description: Cover camera data, retention, secure transport, bounded processing, and assistive feedback as applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
