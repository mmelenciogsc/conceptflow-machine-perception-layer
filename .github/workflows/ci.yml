name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/repository/check_policy.py
      - run: python scripts/repository/secret_scan.py
      - run: python scripts/repository/check_config_examples.py
      - run: bash -n scripts/android-model-prepare scripts/android-qnn-build scripts/android-qnn-depth-build scripts/android-qnn-depth-benchmark

  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: ./scripts/bootstrap
      - run: .venv/bin/python -m pip_audit --skip-editable
      - run: ./scripts/lint python
      - run: ./scripts/format --check
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/python -m conceptflow_mpl_protocol.validation
      - run: ./scripts/demo
      - run: ./scripts/benchmark --iterations 100
      - run: ./scripts/perception-demo
      - run: ./scripts/perception-benchmark --iterations 100
      - run: ./scripts/perception-calibration --json
      - run: ./scripts/perception-training --list
      - run: ./scripts/build python
      - run: .venv/bin/python scripts/repository/check_wheels.py

  native:
    name: Native CMake and CTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S services/cuda-cluster/native -B services/cuda-cluster/native/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCONCEPTFLOW_ENABLE_CUDA=OFF
      - run: cmake --build services/cuda-cluster/native/build-ci --parallel
      - run: ctest --test-dir services/cuda-cluster/native/build-ci --output-on-failure

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install pinned Android native toolchain
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew --no-daemon --dependency-verification strict lintDebug testDebugUnitTest assembleDebug

  windows-dotnet:
    name: Windows .NET 8 and WPF
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop-relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore ConceptFlow.Mpl.DesktopRelay.sln --locked-mode
      - name: Audit .NET dependencies
        shell: pwsh
        run: |
          $reportLines = dotnet list ConceptFlow.Mpl.DesktopRelay.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet package vulnerability audit failed with exit code $LASTEXITCODE"
          }
          $reportText = $reportLines -join [Environment]::NewLine
          $report = $reportText | ConvertFrom-Json -ErrorAction Stop
          if ($null -eq $report.version -or $null -eq $report.projects) {
            throw "dotnet package vulnerability audit returned an unexpected JSON schema"
          }
          $packages = @(
            $report.projects |
              ForEach-Object { $_.frameworks } |
              ForEach-Object { @($_.topLevelPackages); @($_.transitivePackages) }
          )
          $vulnerablePackages = @(
            $packages | Where-Object { $null -ne $_ -and @($_.vulnerabilities).Count -gt 0 }
          )
          if ($vulnerablePackages.Count -gt 0) {
            Write-Host $reportText
            throw "The .NET dependency audit reported $($vulnerablePackages.Count) vulnerable package(s)"
          }
      - run: dotnet build ConceptFlow.Mpl.DesktopRelay.sln --configuration Release --no-restore
      - run: dotnet test ConceptFlow.Mpl.DesktopRelay.sln --configuration Release --no-build
      - run: dotnet run --project src/ConceptFlow.Mpl.DesktopRelay.Demo/ConceptFlow.Mpl.DesktopRelay.Demo.csproj --configuration Release --no-build -- --consent-synthetic-demo
