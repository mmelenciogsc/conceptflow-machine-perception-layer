# SPDX-License-Identifier: MIT OR Apache-2.0
name: Self-hosted GPU and device validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda:
    name: CUDA self-hosted validation
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify real GPU prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v nvidia-smi >/dev/null || { echo "nvidia-smi is required on the GPU runner" >&2; exit 1; }
          command -v nvcc >/dev/null || { echo "nvcc is required on the GPU runner" >&2; exit 1; }
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          nvcc --version
      - name: Configure, build, and test CUDA boundary
        run: cmake -S services/cuda-cluster/native -B services/cuda-cluster/native/build-hardware -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCONCEPTFLOW_ENABLE_CUDA=ON
      - run: cmake --build services/cuda-cluster/native/build-hardware --parallel
      - run: ctest --test-dir services/cuda-cluster/native/build-hardware --output-on-failure

  rokid-device:
    name: Android and Rokid device smoke
    runs-on: [self-hosted, linux, x64, rokid]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install pinned Android native toolchain
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify a real authorized device
        shell: bash
        run: |
          set -euo pipefail
          command -v adb >/dev/null || { echo "adb is required on the Rokid runner" >&2; exit 1; }
          device_count="$(adb devices | awk 'NR > 1 && $2 == "device" { count++ } END { print count + 0 }')"
          test "$device_count" -eq 1 || { echo "Expected exactly one authorized Android/Rokid device; found $device_count" >&2; exit 1; }
          adb get-state
          adb shell getprop ro.product.manufacturer
          adb shell getprop ro.product.model
      - run: ./gradlew --no-daemon --dependency-verification strict lintDebug testDebugUnitTest assembleDebug
      - name: Install non-display device client
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/rokid-client/build/outputs/apk/debug/rokid-client-debug.apk"
          test -f "$apk" || { echo "Expected APK was not produced: $apk" >&2; exit 1; }
          ./scripts/rokid-install --no-build --grant-camera
      - name: Validate non-display capture lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { ./scripts/rokid-control stop >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ./scripts/rokid-control capture-start
          sleep 3
          adb shell pidof org.conceptflow.mpl.rokidclient >/dev/null
          adb shell dumpsys media.camera | grep -F "Client Package Name: org.conceptflow.mpl.rokidclient" >/dev/null
          ./scripts/rokid-control stop
          trap - EXIT
          sleep 1
          ! adb shell pidof org.conceptflow.mpl.rokidclient >/dev/null 2>&1
